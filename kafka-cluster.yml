apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: default
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server:7.5.0
    init: confluentinc/cp-init-container:7.5.0
  dataVolumeCapacity: 10Gi
  listeners:
    internal:
      authentication:
        type: plain
  dependencies:
    zookeeper:
      endpoint: zookeeper:2181
---
apiVersion: platform.confluent.io/v1beta1
kind: Zookeeper
metadata:
  name: zookeeper
  namespace: default
spec:
  replicas: 1
  image:
    application: confluentinc/cp-zookeeper:7.5.0
    init: confluentinc/cp-init-container:7.5.0
  dataVolumeCapacity: 10Gi
  logVolumeCapacity: 10Gi
