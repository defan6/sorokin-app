spring:
  application:
    name: profile-service
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  kafka:
    bootstrap-servers: kafka:9092

server:
  port: 8080

app:
  default-avatar-url: "https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y"
