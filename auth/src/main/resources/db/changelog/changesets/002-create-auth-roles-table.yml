databaseChangeLog:
  - changeSet:
      id: 2
      author: fedorVX
      changes:
        - createTable:
            tableName: auth_roles
            columns:
              - column:
                  name: auth_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: roles
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: auth_roles
            baseColumnNames: auth_id
            constraintName: fk_auth
            referencedTableName: auths
            referencedColumnNames: id