server:
  port: 8083

spring:
  application:
    name: event-notificator
  datasource:
    url: jdbc:postgresql://localhost:5432/event_notificator_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
