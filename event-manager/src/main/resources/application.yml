spring:
  application:
    name: event-manager
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: kafka:9092
success:
  register:
    message: "We were successfully registered"
  booking:
    message: "You were successfully registered. We'll wait you."
  cancel:
    booking:
      message: "Your booking was cancelled."
