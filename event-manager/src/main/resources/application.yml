spring:
  application:
    name: event-manager
  datasource:
    url: jdbc:postgresql://postgres:5432/event_manager_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: kafka:9092
success:
  register:
    message: "We were successfully registered"
  booking:
    message: "You were successfully registered. We'll wait you."
  cancel:
    booking:
      message: "Your booking was cancelled."
