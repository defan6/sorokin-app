databaseChangeLog:
  - changeSet:
      id: 5
      author: fedorVX
      preConditions:
        - tableExists:
            tableName: users_roles
        - tableExists:
            tableName: users
        - tableExists:
            tableName: roles
      changes:
        - sql:
            sql: |
              -- Всем пользователям даем роль USER (role_id = 1)
              INSERT INTO users_roles (user_id, role_id)
              SELECT u.id, 1
              FROM users u
              WHERE NOT EXISTS (
                SELECT 1 FROM users_roles ur 
                WHERE ur.user_id = u.id AND ur.role_id = 1
              )
        - sql:
            sql: |
              -- Первому пользователю даем также роль ADMIN (role_id = 2)
              INSERT INTO users_roles (user_id, role_id)
              SELECT u.id, 2
              FROM users u
              WHERE u.id = (SELECT MIN(id) FROM users)
              AND NOT EXISTS (
                SELECT 1 FROM users_roles ur 
                WHERE ur.user_id = u.id AND ur.role_id = 2
              )
      rollback:
        - delete:
            tableName: users_roles
            where: "user_id IS NOT NULL"