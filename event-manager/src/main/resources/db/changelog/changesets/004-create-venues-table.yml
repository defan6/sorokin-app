databaseChangeLog:
  - changeSet:
      id: 4
      author: fedorVX
      preConditions:
        - not:
            - tableExists:
                tableName: venues
      changes:
        - createTable:
            tableName: venues
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: capacity
                  type: BIGINT
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: venues