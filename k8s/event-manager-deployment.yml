apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-manager-deployment
  labels:
    app: event-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-manager
  template:
    metadata:
      labels:
        app: event-manager
    spec:
      containers:
      - name: event-manager
        # Перед применением этого манифеста, убедитесь, что вы собрали
        # и загрузили образ в ваш кластер или реестр.
        # Например, для minikube: eval $(minikube docker-env) && docker build -t event-manager:latest ./event-manager
        image: ddosl/sorokin-app-event-manager:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: POSTGRES_PASSWORD
